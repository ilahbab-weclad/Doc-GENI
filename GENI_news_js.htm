    <td valign="middle" align="center"><font face="Arial" size="2" color="#993333"><b>
<script language="JavaScript1.2">
ejs_scroll_largeur = 500;
ejs_scroll_hauteur = 30;
ejs_scroll_bgcolor = '';
/* Mettre ici le chemin de l'image de fond */
ejs_scroll_background = "";
/* Mettre ici le temps en secondes */
ejs_scroll_pause_seconde = 3;

ejs_scroll_message = new Array;
ejs_scroll_message[0]='<a href="GENI_news_log.htm" target="_blank"><SPAN STYLE="color:#000000;">Nouveautés dans la documentation GENI...</SPAN></a>';
ejs_scroll_message[1]='<a href="doc_ppt/flux_docs_matieres.pps" target="_blank"><SPAN STYLE="color:#993333;">Flux de documents et matières (pps)</SPAN></a>';
ejs_scroll_message[2]='<a href="production/GENI_production_pad.htm" target="_blank"><SPAN STYLE="color:#993333;">Terminaux portables - lecteurs code barre</SPAN></a>';
ejs_scroll_message[3]='<a href="GENI_news_log.htm" target="_blank"><SPAN STYLE="color:#993333;">Gestion Electronique de Documents (GED)</SPAN></a>';
ejs_scroll_message[4]='<a href="FAQ2.htm" target="_blank"><SPAN STYLE="color:#993333;">Raccourcis clavier - code ascii</SPAN></A><font size="1" color="#000000"> ( 03-02-2011 )</font>';
function d(texte)
	{
	document.write(texte);
	}

d('<DIV ID=ejs_scroll_relativ STYLE="position:relative;width:'+ejs_scroll_largeur+';height:'+ejs_scroll_hauteur+';background-color:'+ejs_scroll_bgcolor+';background-image:url('+ejs_scroll_background+')">');
d('<DIV ID=ejs_scroll_cadre STYLE="position:absolute;width:'+(ejs_scroll_largeur-8)+';height:'+(ejs_scroll_hauteur-8)+';top:4;left:4;clip:rect(0 '+(ejs_scroll_largeur-8)+' '+(ejs_scroll_hauteur-8)+' 0)">');
d('<div id=ejs_scroller_1 style="position:absolute;width:'+(ejs_scroll_largeur-8)+';left:0;top:0;" CLASS=ejs_scroll>'+ejs_scroll_message[0]+'</DIV>');
d('<div id=ejs_scroller_2 style="position:absolute;width:'+(ejs_scroll_largeur-8)+';left:0;top:'+ejs_scroll_hauteur+';" CLASS=ejs_scroll>'+ejs_scroll_message[1]+'</DIV>');
d('</DIV></DIV>');

ejs_scroll_mode =1;
ejs_scroll_actuel = 0;

function ejs_scroll_start()
	{
	if(ejs_scroll_mode == 1)
		{
		ejs_scroller_haut = "ejs_scroller_1";
		ejs_scroller_bas = "ejs_scroller_2";
		ejs_scroll_mode = 0;
		}
	else
		{
		ejs_scroller_bas = "ejs_scroller_1";
		ejs_scroller_haut = "ejs_scroller_2";
		ejs_scroll_mode = 1;
		}
	ejs_scroll_nb_message = ejs_scroll_message.length-1;
	if(ejs_scroll_actuel == ejs_scroll_nb_message)
		ejs_scroll_suivant = 0;
	else
		ejs_scroll_suivant = ejs_scroll_actuel+1;
	if(document.getElementById)
		document.getElementById(ejs_scroller_bas).innerHTML = ejs_scroll_message[ejs_scroll_suivant];
	ejs_scroll_top = 0;
	if(document.getElementById)
		setTimeout("ejs_scroll_action()",ejs_scroll_pause_seconde*1000)
	}

function ejs_scroll_action()
	{
	ejs_scroll_top -= 1;
	document.getElementById(ejs_scroller_haut).style.top = ejs_scroll_top;
	document.getElementById(ejs_scroller_bas).style.top = ejs_scroll_top+ejs_scroll_hauteur;
	if((ejs_scroll_top+ejs_scroll_hauteur) > 0)
		setTimeout("ejs_scroll_action()",10)
	else
		ejs_scroll_stop()
	}

function ejs_scroll_stop()
	{
	ejs_scroll_actuel = ejs_scroll_suivant;
	ejs_scroll_start()
	}

window.onload = ejs_scroll_start;
</SCRIPT>
</b></font></td>
    <td width="1%" valign="middle" align="right"><b><a href="GENI_news_log.htm"><img border="0" src="Images/Event/smallnew.gif" align="absmiddle" width="33" height="20"></a></b></td>
