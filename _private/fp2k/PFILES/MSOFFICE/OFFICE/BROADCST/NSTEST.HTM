    }

function makeRelative(abpath) {

    
    for(i=abpath.length; i>0; i--)
      {
        if( (abpath.charAt(i) == '\\') || (abpath.charAt(i) == '/') )
          {
            break;
          }
       }

	 relpath = abpath.substr( i+1 );
     return relpath;
}  // End of function



</script>
