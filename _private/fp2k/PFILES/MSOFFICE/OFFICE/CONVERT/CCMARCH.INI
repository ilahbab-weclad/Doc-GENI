[Microsoft Importer for Lotus cc:Mail Archives]

; LogDetail.  Specifies the logging level.  Logging levels can be
; 0 (None), 1 (Standard), 2 (Verbose), or 3 (Debug).  None 
; disables logging to a file.  Standard means log high-level
; actions for user reference.  Verbose means log more detailed 
; actions and WARNINGS for user trouble-shooting or technical support.
; Debug means log highly specific details for use by Technical 
; Support in solving a problem. The default is 1 (Standard).
;
LogDetail=1


; LogPath.  Specifies the location of the log file.  Options are
; blank (log file is written to the location of the Importer 
; executable), LOCAL (log file is written to the local
; Windows temporary directory specified by the TMP environment 
; variable) or a path (the path of the log file, for instance, 
; c:\mbc\log).  By default (i.e., no entry is specified) the log 
; file is written to the location of the Importer executable. 
; If the Importer is being run by multiple users from a shared network 
; directory this entry should be set to LOCAL.
;
LogPath=LOCAL


; MaxLogSize.  Specifies the maximum size of the log file, 
; expressed as kilobytes.  The default is 1024K.
;
;MaxLogSize=1024

; SkipAttachments.  Specifies whether or not attachments should 
; be converted.  Options are 0 (convert attachments), or 1 (do
; not convert attachments).  The default is 0 (convert 
; attachments).
;
;SkipAttachments=0


; MaxMsgSize.  Specifies the maximum size of a message to be 
; converted in kilobytes.  0, the default, indicates all files will 
; be converted regardless of size. 
;
;MaxMsgSize=0


; XLATORType.  Specifies whether to use a translation table or a
; custom .dll for name translations.  Options are LOOKUP (uses 
; TRANSLAT.CCC or the file specified in the XLATORFIle setting to
; translate names during conversion) or DLL (loads the .dll in 
; XLATORFile setting to translate names during conversion).  The
; default is LOOKUP.
;
;XLATORType=LOOKUP


; XLATORFile.  Specifies the file to use for name translation 
; during conversion.  Options are blank (TRANSLAT.CCC will be
; used to translate names during conversion) or a filename (the
; path and filename to be used to translate names during 
; conversion, for instance, c:\newname.c2x or 
; g:\exchname.dll.  This file can be a text file using the
; same format as TRANSLAT.CCC or a custom .dll which will be 
; loaded by the Importer).  If no file is specified and
; TRANSLAT.CCC cannot be found, display names will be 
; copied to Exchange during conversion without translation.  
;
;XLATORFile=


; ShowDefaultStore. The default store is configured in a Mail Profile's
; "Microsoft Exchange Server" Delivery property page and defines which 
; container messages are delivered to in Exchange. This can be configured
; to be the Server mailbox or any local store. Options are 1 (present the 
; default store, local or Server depending on the profile's configuration,
; in the drop-down list of available stores) and 0 (show only local stores 
; in the list). If the default store in your organization is a Server 
; mailbox and you want to force users to pick only a local store to import 
; to set this to 0. The default is 1.
;
;ShowDefaultStore = 1


; LocalStorePreference. Specifies the display name of the store to import to 
; by default. The user will see this as the selected destination store when 
; the program is invoked. The user can still select any other available. 
; If the store does not exact the Importer program will not create it. By default,
; the store preference is set to the default store (local or Server depending on 
; the Mail Profile's configuration)
;
;LocalStorePreference=cc:Mail


; InitialArchiveDirectory. Specifies the default directory location of
; the cc:Mail archive files. This is the directory that comes up in the
; common file dialog when the user chooses to Browse for cc:Mail archive
; files. By default, this is set to the current directory.
;
;InitialArchiveDirectory=u:\ccMail Archives


; OEMCodePage. Specifies the source code page to use for translation of the
; message body and text items when no code page information is present for a
; message in the archive file. This should be set to the OEM code page of the 
; machine that the archive message was created on and, by default, it is set to
; the OEM code page of the machine that you are running the Importer on.
; This setting does not override code page information contained in the message. It
; is used only when code page information is absent. The message body and text
; items are always translated to the Windows ANSI code page of the machine that
; you are running the Importer on.
;
;OEMCodePage=437


; PostOfficeCodePage. Specifies the source code page to use for translation of
; directory names when no code page information is present for a message in the 
; archive file. This should be set to the code page of the users' cc:Mail post 
; office. By default, it is set to the OEM code page of the machine that you 
; are running the Importer on. 
; This setting does not override code page information contained in the message. It
; is used only when code page information is absent. Directory names are always 
; translated to the Windows ANSI code page of the machine that you are running the
; Importer on.
;
;PostOfficeCodePage=437


; IncludePostOfficeNameInAddress. By default directory names are imported to exchange
; without the post office name appended (i.e., "John Smith" instead of "John Smith at 
; ccmpo40") If you wanted the post office name included in the imported name set this
; to 1. The default is 0 (don't include the post office name).
;
;IncludePostOfficeNameInAddress=0


; DefaultPostOfficeName. Specifies the default post office name to use for any names
; in the message that do not have a post office name component. (note that 
; IncludePostOfficeNameInAddress must be set to 1 for this setting to apply). The 
; default is the empty string.
;
; DefaultPostOfficeName=ccmpo40


; AtString. This specifies that default string used for the "at" string in a cc:Mail
; address that contains a post office name, i.e., "username at ccmpo40". By defualt,
; the string is set to "at".
;
;AtString=at


; GMTBias. (16-bit version ONLY) Specifies how many minutes you need to add to the 
; local time to create GMT time. The default is Pacific Standard Time or 480 minutes.
;
;GMTBias =  480


; DaylightBias. (16-bit version ONLY) Specifies how many minutes you need to add to the 
; local time to create Daylight time. The default is minus 60 minutes.
;
;DaylightBias = -60
